name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml'
      - 'testbench.yaml'
      - '.github/workflows/run-tests.yml'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml'
      - 'testbench.yaml'
      - '.github/workflows/run-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        ai: ['^0.9', '^1.0']
        dependencies: ['lowest', 'highest']
        include:
          - laravel: '12'
            testbench: '10.*'
          - laravel: '13'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / laravel/ai ${{ matrix.ai }} / ${{ matrix.dependencies }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, libxml, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Constrain Testbench and laravel/ai versions
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer require "laravel/ai:${{ matrix.ai }}" --no-interaction --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: composer test

  static-analysis:
    runs-on: ubuntu-latest

    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: composer analyse
