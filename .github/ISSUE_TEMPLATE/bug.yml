name: Bug report
description: Something in Laravel AI Usage does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please check that you use the latest version of the package first.

        Do not paste API keys, prompts or other private data from your usage records.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect to happen, and what happened instead?
      placeholder: An agent call in a queued job is recorded without its feature.
    validations:
      required: true

  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: The steps, and the relevant code or config (the agent, the `AiUsage::context()` call, `config/ai-usage.php`).
      placeholder: |
        1. Prompt an agent inside `AiUsage::context(..., subject: $mail)` in a queued job
        2. Open the record in /ai-usage/records
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: The relevant exception or log lines, if any. Only the relevant part, please.
      render: shell
    validations:
      required: false

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: 12.30.0
    validations:
      required: true

  - type: input
    id: laravel-ai-version
    attributes:
      label: laravel/ai version
      placeholder: 0.11.2
    validations:
      required: true

  - type: dropdown
    id: php-version
    attributes:
      label: PHP version
      options:
        - '8.4'
        - '8.5'
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: AI provider(s) involved
      multiple: true
      options:
        - OpenAI
        - Anthropic
        - Gemini
        - Mistral
        - xAI
        - DeepSeek
        - Groq
        - OpenRouter
        - Other
        - Not provider specific
